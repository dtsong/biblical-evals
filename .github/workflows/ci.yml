name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  UV_VERSION: "0.5"

jobs:
  # =============================================================================
  # Detect Changes
  # =============================================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'
            terraform:
              - 'terraform/**'

  # =============================================================================
  # API (Python) - Lint, Test
  # =============================================================================
  api-lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check src tests

      - name: Format check with ruff
        run: uv run ruff format --check src tests

  api-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biblical_evals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/biblical_evals_test
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: >-
          uv run pytest -v
          --cov=src
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=85

  # =============================================================================
  # Web (Next.js) - Lint, Type Check, Build
  # =============================================================================
  web-checks:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @biblical-evals/web lint

      - name: Type check
        run: pnpm --filter @biblical-evals/web typecheck

      - name: Test with coverage
        run: pnpm --filter @biblical-evals/web test:coverage

      - name: Build
        run: pnpm --filter @biblical-evals/web build

  # =============================================================================
  # Terraform - Validate
  # =============================================================================
  terraform-validate:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  # =============================================================================
  # CI Status - Aggregate job for branch protection
  # =============================================================================
  ci-status:
    runs-on: ubuntu-latest
    needs: [changes, api-lint, api-test, web-checks, terraform-validate]
    if: always()
    steps:
      - name: Evaluate required jobs
        env:
          API_CHANGED: ${{ needs.changes.outputs.api }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          TERRAFORM_CHANGED: ${{ needs.changes.outputs.terraform }}

          API_LINT_RESULT: ${{ needs.api-lint.result }}
          API_TEST_RESULT: ${{ needs.api-test.result }}
          WEB_CHECKS_RESULT: ${{ needs.web-checks.result }}
          TERRAFORM_VALIDATE_RESULT: ${{ needs.terraform-validate.result }}
        run: |
          set -euo pipefail

          fail=0

          require_success_when_changed() {
            local name="$1"
            local changed="$2"
            local result="$3"

            if [ "$changed" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "::error::${name} required but result=${result}"
                fail=1
              fi
            else
              # When not changed, the job is expected to be skipped.
              if [ "$result" != "skipped" ] && [ "$result" != "success" ]; then
                echo "::error::${name} unexpected result=${result}"
                fail=1
              fi
            fi
          }

          echo "Changes: api=${API_CHANGED} web=${WEB_CHANGED} terraform=${TERRAFORM_CHANGED}"
          echo "Results: api-lint=${API_LINT_RESULT} api-test=${API_TEST_RESULT} web-checks=${WEB_CHECKS_RESULT} terraform-validate=${TERRAFORM_VALIDATE_RESULT}"

          require_success_when_changed "api-lint" "$API_CHANGED" "$API_LINT_RESULT"
          require_success_when_changed "api-test" "$API_CHANGED" "$API_TEST_RESULT"
          require_success_when_changed "web-checks" "$WEB_CHANGED" "$WEB_CHECKS_RESULT"
          require_success_when_changed "terraform-validate" "$TERRAFORM_CHANGED" "$TERRAFORM_VALIDATE_RESULT"

          if [ "$fail" -ne 0 ]; then
            echo "CI status: failed"
            exit 1
          fi

          echo "CI status: ok"
